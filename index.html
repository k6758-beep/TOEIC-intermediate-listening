<!DOCTYPE html>
<html lang="zh-Hant-TW" data-level="B" data-style="oxford">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聽得準，答得快｜多益聽力中級練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --ink:#1C2B39; --muted:#5B6773; --line:#D3DCE5;
  --red:#C8323F; --red-soft:#FBE8EA; --green:#127A57; --green-soft:#E1F3EA; --blue:#2C5D8F; --blue-soft:#E6EEF7;
  --art-g:#9AA4AE; --art-g2:#D9C3A5;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121920; --paper:#1B242E; --ink:#E6ECF2; --muted:#9BA8B5; --line:#33414E;
    --red:#F0707B; --red-soft:#3A2228; --green:#4DC598; --green-soft:#16332A; --blue:#8DB6E3; --blue-soft:#1C2A3A;
    --art-g:#6B7783; --art-g2:#8A7458; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121920; --paper:#1B242E; --ink:#E6ECF2; --muted:#9BA8B5; --line:#33414E;
  --red:#F0707B; --red-soft:#3A2228; --green:#4DC598; --green-soft:#16332A; --blue:#8DB6E3; --blue-soft:#1C2A3A;
  --art-g:#6B7783; --art-g2:#8A7458; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer",system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
.sheet-head{border-top:6px double var(--red);margin-top:12px;padding:18px 0 8px}
.sheet-head h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(34px,8vw,48px);line-height:1.15;margin:0;letter-spacing:.04em}
.sheet-head p{margin:8px 0 0;color:var(--muted);max-width:36em}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--red)}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;flex:none}
.topbar h2{margin:0;font-size:20px;font-family:"Noto Serif TC",serif}
h3{font-size:19px;margin:30px 0 10px;font-family:"Noto Serif TC",serif}
.muted{color:var(--muted)}.small{font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.settings label{display:flex;flex-direction:column;font-size:14px;color:var(--muted);gap:4px}
.settings select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.warn{margin-top:12px;padding:10px 12px;border-left:4px solid var(--red);background:var(--red-soft);border-radius:4px;font-size:15px}
.note{margin-top:12px;padding:10px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:4px;font-size:15px}
.parts{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.parts li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.num{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:700}
.parts b{display:block}.parts span{color:var(--muted);font-size:15px}
.topics{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.topic{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.topic:hover{background:var(--paper)}
.topic .ic{font-size:34px;line-height:1;text-align:center}
.topic .nm{font-weight:700;font-size:18px}.topic .ds{color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--red)}
.dot.ok{background:var(--green);border-color:var(--green)}.dot.no{background:var(--red-soft)}
.topic .sp{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}.btn{white-space:nowrap}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 12px;font-size:14px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;margin:14px 0 4px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.tabs button{flex:1;border:0;background:none;padding:9px 2px;font-size:16px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.vlist{list-style:none;margin:12px 0 0;padding:0}
.vlist li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.say{width:40px;height:40px;border-radius:50%;border:2px solid var(--red);background:var(--paper);color:var(--red);display:inline-grid;place-items:center;padding:0;flex:none;vertical-align:middle}
.say.sm{width:30px;height:30px;border-width:1.5px}
.say svg{width:16px;height:16px}.say.sm svg{width:13px;height:13px}
.py{font-size:14px;color:var(--muted);letter-spacing:.02em}
.zh{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:600;line-height:1.25}
.gl{font-size:15px}
.links{font-size:14px;display:flex;gap:14px;margin-top:2px;flex-wrap:wrap}
.goal{font-size:18px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:8px;margin-top:14px}
.vary{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.vary .items{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;background:var(--bg);font-size:17px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.rel .w{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}
.rel .w b{font-family:"Noto Serif TC",serif;font-size:20px;display:block;line-height:1.2}
.tool{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:14px;margin-top:12px}
.tool .big{font-size:40px;font-weight:700;text-align:center;letter-spacing:.03em;margin:8px 0;font-family:system-ui,sans-serif;min-height:56px}
.tool .forms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:36px}
.navstrip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.nb{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);background:var(--paper);color:var(--red);font-weight:700;font-size:13px;padding:0}
.nb.cur{outline:3px solid var(--blue);outline-offset:1px}
.nb.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nb.ok{background:var(--green);border-color:var(--green);color:#fff}
.nb.no{background:var(--red);color:#fff}
.q{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px}
.qhead .part{color:var(--red);font-weight:700}
.scene{margin:14px auto 4px;max-width:320px;aspect-ratio:4/3;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;text-align:center;background:var(--paper)}
.scene b{display:block;font-size:30px;font-family:system-ui,sans-serif}
.player{display:flex;align-items:center;gap:14px;margin:16px 0}
.play{width:72px;height:72px;border-radius:50%;border:3px solid var(--red);background:var(--paper);color:var(--red);display:grid;place-items:center;flex:none}
.play svg{width:26px;height:26px;margin-left:4px}
.play.on{background:var(--red);color:#fff}
.wave{display:flex;gap:4px;align-items:center;height:36px}
.wave i{display:block;width:5px;height:8px;border-radius:3px;background:var(--line)}
.play.on + .wave i{background:var(--red);animation:wv .9s ease-in-out infinite}
.play.on + .wave i:nth-child(2){animation-delay:.12s}.play.on + .wave i:nth-child(3){animation-delay:.24s}
.play.on + .wave i:nth-child(4){animation-delay:.36s}.play.on + .wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:8px}50%{height:34px}}
@media (prefers-reduced-motion:reduce){.play.on + .wave i{animation:none;height:22px}}
.player .hint{font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .bub{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .bub{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.opts.pics{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.pics .opt{flex-direction:column;align-items:stretch;padding:8px}
.pic{font-size:44px;line-height:1.15;text-align:center;padding:8px 0;min-height:90px;display:grid;place-items:center}
.pic b{font-size:18px;display:block;font-family:system-ui,sans-serif}
.pic svg{width:88px;height:88px}
.art .f{fill:currentColor}.art .w{fill:var(--paper)}.art .g{fill:var(--art-g)}.art .g2{fill:var(--art-g2)}
.art .t{fill:currentColor;stroke:none;font-weight:700;font-family:system-ui,sans-serif}
.scene .art{width:auto;height:92%}
.hidden-opt{color:var(--muted);font-size:15px}
.fb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.script{margin:8px 0;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:16px}
.script p{margin:2px 0}
.who{color:var(--muted);font-size:14px;margin-right:4px}
.key{font-size:15px}
.tr{margin-top:8px;font-size:15px}
.tr ol{margin:6px 0 0;padding-left:22px}
.tr li{margin:2px 0}
.trl{display:block;color:var(--blue);font-family:"Noto Sans TC","Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer",system-ui,sans-serif;font-size:15px;font-weight:400;line-height:1.5;margin:1px 0 4px}
.trl:empty{display:none}
.sent+.trl{font-size:16px}
.langbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gl .lab{color:var(--muted);font-size:13px;margin-right:6px}
.trout{border-left:3px solid var(--blue);padding:4px 10px;margin-top:6px;background:var(--blue-soft);border-radius:4px}
.card{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sent{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:600;line-height:1.5;margin:2px 0}
.sent .ok{color:var(--green)}.sent .miss{color:var(--red);text-decoration:underline wavy;text-underline-offset:5px}
.rec{background:var(--red);border-color:var(--red);color:#fff}
.rec.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.res{margin-top:10px;font-size:15px}
.score{font-weight:700;font-size:20px}
.kw{display:inline-block;margin:2px 6px 2px 0;padding:1px 10px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.kw.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.samples{margin:10px 0 0;padding-left:0;list-style:none}
.samples li{display:flex;gap:8px;align-items:center;padding:4px 0}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:vertical}
.pat{padding:10px 0;border-bottom:1px solid var(--line)}
.pat .zh{font-size:21px}
.res-list{list-style:none;padding:0;margin:0}
.res-list li{padding:10px 0;border-bottom:1px solid var(--line)}
.res-list b{display:block}
.result-big{font-family:"Noto Serif TC",serif;font-size:56px;font-weight:700;line-height:1}
table{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--green)}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:6px double var(--red);padding-top:12px}
@media (max-width:420px){.pic{font-size:36px}.scene{font-size:54px}.tabs button{font-size:15px}}
.uit{display:block;font-size:13px;color:var(--blue);font-weight:400;line-height:1.4;font-family:"Noto Sans TC","Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer",system-ui,sans-serif;letter-spacing:0}
h3 .uit,h2 .uit{font-size:14px;margin-top:2px}.h1t{font-size:16px;margin-top:4px}
.bl{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.bl small{font-size:11px;font-weight:400;opacity:.85;white-space:normal}
.tabs .bl,.nb .bl{align-items:center;text-align:center}
.btn.xs{padding:3px 10px;font-size:13px;border-width:1.5px}
.ml-zh{font-size:24px;font-weight:700;font-family:"Noto Serif TC",serif;color:var(--red)}
.ml-tr{font-size:16px;font-weight:700;color:var(--ink)}
.star{border:0;background:none;font-size:24px;color:var(--muted);padding:0 4px;line-height:1;align-self:start}
.star.on{color:#E0A100}
.vlist li{grid-template-columns:44px 1fr auto}
.rel .w{position:relative}.rel .w .star{margin-left:auto;font-size:20px}
.linkbtn{border:0;background:none;color:var(--red);padding:0;font-size:14px;text-decoration:underline}
h2.sect{margin:40px 0 0;padding-top:12px;border-top:6px double var(--red);font-family:"Noto Serif TC",serif;font-size:24px}
details.mic{margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
details.mic summary{cursor:pointer;font-weight:700}
details.mic ol{padding-left:22px;margin:8px 0 0}details.mic li{margin:4px 0;font-size:15px}
.ans{color:var(--green)}
.chip>span{display:inline-flex;flex-direction:column}
.chip .trl{font-size:12px;margin:0}
.tabs button{padding:7px 2px}

/* ===== 版面設計：區塊卡片、色彩分區、黏住的導覽 ===== */
:root{--c-info:#2C5D8F;--c-decode:#127A57;--c-topic:#7A4FB5;--c-book:#B7791F;--c-mock:#C8323F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-info:#8DB6E3;--c-decode:#4DC598;--c-topic:#B79BE6;--c-book:#E3B35C;--c-mock:#F0707B}}
:root[data-theme="dark"]{--c-info:#8DB6E3;--c-decode:#4DC598;--c-topic:#B79BE6;--c-book:#E3B35C;--c-mock:#F0707B}
.ml-zh{font-size:20px;font-weight:700;color:var(--red)}
.ml-tr{font-size:14px;font-weight:700;color:var(--ink)}
.settings .mylang{grid-column:1/-1;border:3px solid var(--red);background:var(--red-soft);border-radius:10px;padding:10px 12px}
.settings .mylang select{font-size:17px;font-weight:700;border:2px solid var(--red);background:var(--paper)}
.intro{margin-top:6px;color:var(--muted)}
.quick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px -16px 0;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.quick button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 2px;font-size:14px;font-weight:700;min-width:0}
.quick .qi{font-size:18px;line-height:1}
.quick .bl{align-items:center;text-align:center}.quick .bl small{font-size:10px}
.panel{position:relative;margin-top:18px;background:var(--paper);border-radius:16px;padding:14px 16px 16px;border:1px solid var(--line);border-top:6px solid var(--accent,var(--ink));box-shadow:0 2px 0 rgba(28,43,57,.04);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px)}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.panel .ph h3{margin:0}
.panel .pi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;background:var(--accent)}
.c-info{--accent:var(--c-info)}.c-decode{--accent:var(--c-decode)}.c-topic{--accent:var(--c-topic)}.c-book{--accent:var(--c-book)}.c-mock{--accent:var(--c-mock)}
.panel .sub{padding:12px 0 4px;border-top:1px dashed var(--line);margin-top:10px}
.panel .sub:first-of-type{border-top:0;margin-top:0;padding-top:0}
.panel h4{margin:0 0 6px;font-family:"Noto Serif TC",serif;font-size:17px}
details.acc{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--bg)}
details.acc summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--accent);font-weight:700}
details.acc[open] summary::after{content:"－"}
.accb{padding:0 12px 12px}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:6px 0}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard .ic{font-size:30px;line-height:1;margin-bottom:4px}
.tcard .nm{font-weight:700;font-size:16px;line-height:1.3}
.tcard .uit{font-size:12px}
.tcard .dots{margin-top:6px;justify-content:flex-start}.tcard .dot{width:11px;height:11px}
.tcard .sp{font-size:12px;color:var(--muted)}.tcard .sp .uit{display:inline;margin-left:2px}
.stick{position:sticky;top:0;z-index:20;margin:0 -16px;padding:0 16px 8px;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.stick .topbar{padding:8px 0}.stick .tabs{margin:8px 0 0}
.tabs button{position:relative}
.tn{display:block;font-size:10px;font-weight:700;opacity:.6}
.syl{white-space:nowrap}
.py{overflow-wrap:normal;word-break:keep-all}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:22px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.totop.show{opacity:.9;pointer-events:auto}
footer .credit{font-weight:700;color:var(--ink)}
/* 卡片與題目區塊更清楚 */
.q,.card,.vary,.tool,.goal{border-radius:14px}
.card{border-left:4px solid var(--c-topic)}
.vary{border-left:4px solid var(--c-info)}

.resume{margin-top:10px;padding:12px;border:2px solid var(--c-mock);border-radius:12px;background:var(--red-soft)}
.setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.setbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:2px solid var(--c-mock);border-radius:14px;background:var(--paper);font-weight:700;min-width:0}
.setbtn .bl{align-items:center;text-align:center}
.setbtn .sn{width:34px;height:34px;border-radius:50%;background:var(--c-mock);color:#fff;display:grid;place-items:center;font-size:17px}
.setbtn:disabled{opacity:.4;cursor:not-allowed}
.warnline{margin:10px 0 0;padding:6px 10px;border-radius:8px;background:var(--red-soft);color:var(--ink);font-weight:700}
.warnline .uit{display:inline;margin-left:6px;font-weight:400}

  {p:4,kind:'talk',a:[
    ['M','Before we finish, I\'d like to share last quarter\'s results. Overall sales rose by eight percent, mainly thanks to our online store. However, sales in our downtown branch dropped for the third quarter in a row. I\'ve asked Karen to prepare a customer survey so we can find out why. She\'ll present the findings at next month\'s meeting. In the meantime, I\'d like each of you to send me one idea for bringing more customers into the downtown branch. Please do that by Friday.','結束之前，我想報告上一季的成果。整體業績成長了百分之八，主要歸功於我們的網路商店。不過，市中心分店的業績已經連續第三季下滑。我已經請 Karen 準備一份顧客問卷，讓我們找出原因。她會在下個月的會議報告調查結果。在這段期間，請各位每人給我一個點子，讓更多顧客來市中心分店。請在星期五以前完成。']],
   g:[
    {q:['What does the speaker say about the online store?','說話者提到網路商店的什麼事？'],o:[['It will be redesigned.','會重新設計。'],['It helped increase sales.','它幫助業績成長。'],['It received complaints.','收到客訴。'],['It will close next month.','下個月會關閉。']],ans:1,k:'sales rose…mainly thanks to our online store。thanks to 是「多虧、歸功於」。'},
    {q:['What has Karen been asked to do?','Karen 被要求做什麼？'],o:[['Manage the downtown branch','管理市中心分店'],['Hire more staff','多請員工'],['Prepare a survey','準備問卷'],['Lead next month\'s meeting','主持下個月的會議']],ans:2,k:'I\'ve asked Karen to prepare a customer survey。'},
    {q:['What should the listeners do by Friday?','聽的人星期五以前要做什麼？'],o:[['Submit a suggestion','提交一個建議'],['Visit the downtown branch','去市中心分店'],['Complete a survey','填問卷'],['Review a report','看報告']],ans:0,k:'send me one idea 換句話說是 submit a suggestion。'}]}],

 qa:[{q:['When is your next report or assignment due?','你下一份報告或作業什麼時候要交？'],kw:[['it is due','due','i have to'],['by','on','next','tomorrow','friday','monday','week']],s:[['It\'s due next Monday.','下星期一要交。'],['I have to submit it by Friday at noon.','我必須在星期五中午以前交。']]},

{id:'t3',icon:'🛒',name:'採購與訂單',en:'Purchasing & Orders',tool:['price','num'],
 goal:'聽懂訂貨、缺貨、出貨和請款的對話，分辨數字，並且聽出說話者「話裡的意思」。',

  ['invoice','/ˈɪnvɔɪs/','請款單；發票','I\'m calling about the invoice.'],

  ['remaining','/rɪˈmeɪnɪŋ/','剩下的','The remaining items will arrive later.']],
 related:[['place an order','下訂單'],['business day','工作天'],['unit','單位；件'],['at no extra charge','不另外收費'],['make up for','補償'],['corrected invoice','更正後的請款單'],['purchase order','採購單'],['wholesale','批發']],
 vary:[
  {t:'交貨時間',items:[['How soon can you deliver the chairs?','椅子最快什麼時候可以送到？'],['Within three business days.','三個工作天內。'],['We expect a new shipment on Monday.','我們預計星期一會進貨。']],n:'How soon 問「多快」，回答 within…（在…以內）或 by…（在…以前）。'},
  {t:'訂單出錯',items:[['Only twelve arrived this morning.','今天早上只到了十二個。'],['They sent the wrong color.','他們寄錯顏色了。'],['We charged you for fifteen boxes by mistake.','我們誤收了您十五箱的費用。']],n:'注意數字：ordered（訂了多少）、arrived（到了多少）、remaining（還差多少）。'},
  {t:'補救方法',items:[['I can send a similar model today.','我今天可以寄類似的型號。'],['We\'ll take ten percent off your next order.','您下一筆訂單我們會打九折。'],['I\'ve e-mailed you a corrected invoice.','我已經把更正的請款單寄給您了。']],n:'offer to do（主動提出要做）常常是第三題的答案。'}],
 qs:[
  {p:1,pic:'@moving',o:[['A box has been placed next to a truck.','一個箱子被放在卡車旁邊。'],['A truck is being loaded with furniture.','有人正在把家具搬上卡車。'],['A driver is opening the truck\'s door.','司機正在打開卡車的門。'],['Some boxes are being stacked in a warehouse.','有人正在倉庫裡堆箱子。']],ans:0,k:'卡車旁邊有一個箱子。has been placed 表示「已經放好了」，不需要有人在照片裡。',w:'B、D 的 being loaded、being stacked 都需要有人正在做；照片裡沒有人，也沒有家具。'},
  {p:2,a:[['W','How soon can you deliver the office chairs?','辦公椅最快什麼時候可以送到？']],o:[['They\'re very comfortable.','坐起來很舒服。'],['Within three business days.','三個工作天內。'],['To the main office.','送到總公司。']],ans:1,k:'How soon 問「多快」，回答 Within three business days。',w:'A 在形容椅子；C 回答的是送到哪裡（Where）。'},
  {p:2,a:[['M','Didn\'t we order the blue folders?','我們訂的不是藍色的文件夾嗎？']],o:[['In the supply cabinet.','在用品櫃裡。'],['I\'ll put them in order.','我會把它們排好。'],['Yes, but they sent the wrong color.','是啊，可是他們寄錯顏色了。']],ans:2,k:'否定問句照事實回答：確實訂了藍色，所以說 Yes，再補充發生了什麼事。',w:'A 回答的是地點；B 的 in order 是「按順序」，和 order（訂購）意思不同。'},
  {p:2,a:[['W','Can I get a discount if I order in bulk?','如果大量訂購，可以有折扣嗎？']],o:[['Yes, ten percent off orders over a hundred units.','可以，超過一百件打九折。'],['The bulk of the work is done.','大部分的工作做完了。'],['I counted them twice.','我數了兩次。']],ans:0,k:'Yes/No 問句，回答 Yes 並說明條件。',w:'B 的 the bulk of 是「大部分」；C 的 counted 聽起來像 discount，是相似音陷阱。'},
  {p:3,kind:'conversation',a:[
    ['W','Hello, this is Nina from Brightway Offices. I\'m calling about order number four four seven one. We ordered twenty desk lamps, but only twelve arrived this morning.','你好，我是 Brightway Offices 的 Nina。我打來是關於訂單 4471 號。我們訂了二十盞檯燈，可是今天早上只到了十二盞。'],
    ['M','Let me check. I\'m very sorry. It looks like the remaining eight are out of stock at the moment. We expect a new shipment on Monday.','我查一下。非常抱歉，看起來剩下的八盞目前缺貨。我們預計星期一會進貨。'],
    ['W','Monday? We\'re opening our new office this Friday.','星期一？我們的新辦公室這個星期五就要開幕了。'],
    ['M','I understand. In that case, I can send you eight lamps of a similar model today at no extra charge. Would that work?','我了解。這樣的話，我今天可以寄八盞類似型號的檯燈給您，不另外收費。這樣可以嗎？'],
    ['W','That would be great. Could you e-mail me a picture of that model first?','那太好了。可以先把那個型號的照片用電子郵件寄給我嗎？']],
   g:[
    {q:['Why is the woman calling?','女子為什麼打電話？'],o:[['To cancel an order','取消訂單'],['To report that part of an order is missing','告知訂單少了一部分'],['To ask about a price','詢問價錢'],['To change a delivery address','更改送貨地址']],ans:1,k:'訂了二十盞，只到十二盞：訂單少了一部分。'},
    {q:['Why does the woman say, "We\'re opening our new office this Friday"?','女子為什麼說「我們的新辦公室這個星期五就要開幕了」？'],o:[['To invite the man to an event','邀請男子參加活動'],['To explain why she is busy','說明她為什麼很忙'],['To show that the matter is urgent','表示這件事很急'],['To request a larger order','要求增加訂購數量']],ans:2,k:'這是「話裡的意思」題。男子說星期一才有貨，女子說星期五就要開幕，意思是「星期一太晚了」。'},
    {q:['What does the man offer to do?','男子主動提出要做什麼？'],o:[['Send a different model','寄另一種型號'],['Give a full refund','全額退款'],['Deliver the items himself','親自送貨'],['Provide free delivery next time','下次免運費']],ans:0,k:'I can send you eight lamps of a similar model。a similar model 換句話說是 a different model。'}]},
  {p:4,kind:'message',a:[
    ['M','Hi, this message is for Ms. Alvarez. This is Greg from Delta Paper Supply. I\'m calling about the invoice we sent you last week. It seems there was an error. We charged you for fifteen boxes of copy paper, but you only ordered five. I apologize for the mistake. I\'ve already e-mailed you a corrected invoice, so please ignore the first one. Also, to make up for the trouble, we\'ll take ten percent off your next order. If you have any questions, you can reach me directly at extension two oh four.','你好，這是給 Alvarez 小姐的留言。我是 Delta Paper Supply 的 Greg。我打來是關於上星期寄給您的請款單。看來上面有一個錯誤：我們向您收了十五箱影印紙的費用，可是您只訂了五箱。很抱歉出了這個錯。我已經用電子郵件寄了更正後的請款單給您，所以請不用理會第一份。另外，為了補償造成的麻煩，您下一筆訂單我們會打九折。如果有任何問題，可以直接打分機 204 找我。']],
   g:[
    {q:['What is the purpose of the call?','這通電話的目的是什麼？'],o:[['To confirm a delivery date','確認送貨日期'],['To correct a billing error','更正帳單上的錯誤'],['To promote a new product','推銷新產品'],['To request a payment','催繳款項']],ans:1,k:'the invoice…there was an error。invoice 的錯誤就是 a billing error。'},
    {q:['What does the speaker say he has already done?','說話者說他已經做了什麼？'],o:[['Sent a revised invoice','寄了修正的請款單'],['Shipped the extra boxes','寄出多的箱子'],['Called the manager','打電話給經理'],['Issued a refund','辦理退款']],ans:0,k:'I\'ve already e-mailed you a corrected invoice。corrected 換句話說是 revised。'},
    {q:['What will the listener receive on her next order?','聽的人下一筆訂單會得到什麼？'],o:[['Free shipping','免運費'],['A free sample','免費樣品'],['Faster delivery','更快送達'],['A discount','折扣']],ans:3,k:'we\'ll take ten percent off your next order：打九折就是 a discount。'}]}],
 shadow:[['We ordered twenty desk lamps, but only twelve arrived.','我們訂了二十盞檯燈，可是只到了十二盞。'],['The remaining eight are out of stock at the moment.','剩下的八盞目前缺貨。'],['I\'ve already e-mailed you a corrected invoice.','我已經用電子郵件寄了更正後的請款單給您。']],
 qa:[{q:['Your order arrived, but two items are missing. What would you say?','你訂的貨到了，可是少了兩件。你會怎麼說？'],kw:[['i ordered','my order','i am calling','i received'],['missing','only','arrived','but','send']],s:[['I\'m calling about my order. I ordered ten boxes, but only eight arrived.','我打來是關於我的訂單。我訂了十箱，可是只到了八箱。'],['Two items are missing from my order. Could you send them today?','我的訂單少了兩件。可以今天寄出嗎？']]},
     {q:['How soon do you need the items?','您多快需要這些東西？'],kw:[['i need','we need','by','before','within'],['friday','monday','tomorrow','week','days','today','as soon as possible']],s:[['We need them by this Friday.','我們這個星期五以前需要。'],['As soon as possible. We need them within two days.','越快越好。我們兩天內需要。']]}],
 pat:[['charge + 人 + for + 東西','They charged us for fifteen boxes.','他們向我們收了十五箱的費用。'],['at no extra charge（不另外收費）','We can deliver it at no extra charge.','我們可以送貨，不另外收費。'],['to make up for + 名詞（補償）','To make up for the delay, we\'ll offer a discount.','為了補償延誤，我們會提供折扣。']]},

{id:'t4',icon:'📣',name:'行銷與業務',en:'Marketing & Sales',tool:['num'],
 goal:'聽懂產品上市、顧客調查和廣告的內容，練習聽出「換句話說」。',

 qs:[
  {p:1,pic:'@store',o:[['Customers are lining up outside a shop.','顧客在商店外面排隊。'],['A sign is being hung above a door.','有人正在門上方掛招牌。'],['Merchandise is displayed on the sidewalk.','商品陳列在人行道上。'],['An awning extends over the store entrance.','遮雨棚延伸到商店入口的上方。']],ans:3,k:'商店門口上方有條紋的遮雨棚（awning）。extend over 是「延伸到…上方」。',w:'照片裡沒有人，所以 A、B 不對；店外面也沒有擺商品。'},

  {p:2,a:[['W','Why don\'t we advertise on social media?','我們何不在社群媒體打廣告？']],o:[['Because the meeting ran late.','因為會議開太久了。'],['That\'s worth trying.','值得試試看。'],['I read it in the newspaper.','我在報紙上看到的。']],ans:1,k:'Why don\'t we…? 是提議。回答同意或不同意，不是回答原因。',w:'A 用 Because 回答，是把提議當成問原因的陷阱；C 只是和媒體有關。'},

    {q:['What problem does the man mention?','男子提到什麼問題？'],o:[['The price is too high.','價格太高。'],['The taste is too sweet.','味道太甜。'],['The packaging looks similar to another product.','包裝看起來和別的產品很像。'],['The launch has been delayed.','上市延後了。']],ans:2,k:'the can looks too much like our competitor\'s。can（罐子）換成 packaging（包裝）。'},
    {q:['What does the woman say she will do?','女子說她會做什麼？'],o:[['Contact a competitor','聯絡競爭對手'],['Raise an issue at a meeting','在會議上提出一個問題'],['Conduct another survey','再做一次調查'],['Postpone the launch','延後上市']],ans:1,k:'I\'ll bring it up at this afternoon\'s meeting。bring up 換句話說是 raise an issue。'}]},
  {p:4,kind:'advertisement',a:[
    ['W','Is your small business ready to grow? At Brightline Marketing, we help local companies reach more customers online. Our team will design your website, manage your social media, and send you a clear report every month, so you always know what\'s working. This month only, new clients get their first consultation free of charge. Don\'t just take our word for it. Visit our website to read reviews from over two hundred satisfied business owners. Brightline Marketing: let\'s grow together.','您的小型企業準備好成長了嗎？在 Brightline Marketing，我們幫助在地公司在網路上接觸更多顧客。我們的團隊會設計您的網站、管理您的社群媒體，而且每個月寄給您一份清楚的報告，讓您隨時知道哪些方法有效。只有這個月，新客戶第一次諮詢免費。不要只聽我們說，請上我們的網站，看看兩百多位滿意的企業主寫的評論。Brightline Marketing，讓我們一起成長。']],
   g:[
    {q:['What type of business is being advertised?','這是哪一種公司的廣告？'],o:[['A printing company','印刷公司'],['A marketing firm','行銷公司'],['An accounting office','會計事務所'],['A computer store','電腦店']],ans:1,k:'Brightline Marketing 幫公司做網站和社群媒體，是行銷公司。firm 就是公司。'},
    {q:['What does the business provide every month?','這家公司每個月提供什麼？'],o:[['A report','一份報告'],['A coupon','折價券'],['A new website','新網站'],['A training session','訓練課程']],ans:0,k:'send you a clear report every month。'},
    {q:['According to the speaker, what can listeners find on the website?','根據說話者，聽的人可以在網站上找到什麼？'],o:[['A price list','價目表'],['Job openings','職缺'],['Discount codes','折扣碼'],['Customer reviews','顧客評論']],ans:3,k:'Visit our website to read reviews from…business owners。'}]}],
 shadow:[['Most of them liked the taste.','大部分的人喜歡它的味道。'],['We still have six weeks before the launch.','離上市還有六個星期。'],['New clients get their first consultation free of charge.','新客戶第一次諮詢免費。']],
 qa:[{q:['How would you advertise a new coffee shop?','你會怎麼宣傳一家新開的咖啡店？'],kw:[['i would','i will','we can','we could'],['social media','online','discount','free','coupon','photos','poster']],s:[['I would post photos on social media and offer a discount in the first week.','我會在社群媒體貼照片，並且在第一個星期提供折扣。'],['We could give free coffee to the first fifty customers.','我們可以送免費咖啡給前五十位顧客。']]},
     {q:['What do you think of this design?','你覺得這個設計怎麼樣？'],kw:[['i think','i like','in my opinion','it looks'],['color','but','should','simple','great','change','bright']],s:[['I like it, but I think we should change the color.','我喜歡，可是我認為應該換顏色。'],['It looks great. The design is simple and easy to remember.','看起來很棒。設計很簡單，容易記住。']]}],
 pat:[['Why don\'t we + 動詞原形?（提議）','Why don\'t we ask the design team?','我們何不問問設計團隊？'],['look like + 名詞（看起來像）','The can looks like our competitor\'s.','這個罐子看起來像競爭對手的。'],['be in charge of + 名詞（負責）','She\'s in charge of the marketing team.','她負責行銷團隊。']]},

{id:'t5',icon:'📦',name:'物流與倉儲',en:'Logistics & Warehousing',tool:['time','num'],
 goal:'聽懂出貨、庫存和倉庫廣播，分清楚「正在做」和「已經做好」，並且把時間和圖表對起來。',
 vocab:[
  ['inventory','/ˈɪnvənˌtɔri/','庫存；存貨清單','The inventory report is wrong.'],
  ['warehouse','/ˈwɛrˌhaʊs/','倉庫','The boxes are in the warehouse.'],
  ['customs','/ˈkʌstəmz/','海關','The shipment cleared customs.'],
  ['loading dock','/ˈloʊdɪŋ dɑk/','裝卸貨區','Take these to the loading dock.'],
  ['inspection','/ɪnˈspɛkʃən/','檢查','The safety inspection is on Thursday.'],
  ['fragile','/ˈfrædʒəl/','易碎的','Be careful. These items are fragile.'],
  ['tracking number','/ˈtrækɪŋ ˌnʌmbɚ/','追蹤號碼','Here is your tracking number.'],
  ['behind schedule','/bɪˈhaɪnd ˈskɛdʒul/','進度落後','The truck is behind schedule.']],
 related:[['stack','堆疊'],['load','裝貨'],['unload','卸貨'],['recount','重新清點'],['walkway','走道'],['give a hand','幫忙'],['ahead of schedule','進度超前'],['volunteer','自願者']],
 vary:[
  {t:'貨到了沒',items:[['Has the shipment cleared customs yet?','那批貨通關了嗎？'],['Yes, it was released this morning.','通關了，今天早上放行的。'],['The truck is running an hour behind schedule.','卡車比預定時間晚了一個小時。']],n:'clear customs 是「通關」；behind schedule 是落後，ahead of schedule 是超前。'},
  {t:'正在做 和 已經做好',items:[['Boxes are being unloaded from a truck.','有人正在從卡車上卸箱子。'],['Boxes have been stacked on a cart.','箱子已經堆在推車上了。']],n:'Part 1 最重要的觀念：are being + p.p. 要有人正在做；have been + p.p. 是已經完成的狀態。'},
  {t:'庫存問題',items:[['I can only find a hundred fifty on the shelves.','我在架上只找到一百五十箱。'],['The count in the system is wrong.','系統裡的數量是錯的。'],['I\'d better recount everything.','我最好全部重新清點。']],n:'I\'d better = I had better，「我最好…」，後面加動詞原形。'}],
 qs:[
  {p:1,pic:'@x-boxes',o:[['Some boxes are stacked on a cart.','一些箱子堆在推車上。'],['Some boxes are being unloaded from a truck.','有人正在從卡車上卸箱子。'],['A worker is sealing a package.','工人正在封箱。'],['Shelves are being assembled.','有人正在組裝架子。']],ans:0,k:'推車上堆了三個箱子。are stacked 是「堆著」的狀態。',w:'照片裡沒有人、沒有卡車，所以 being unloaded、sealing、being assembled 都不對。'},
  {p:2,a:[['W','Has the shipment from Osaka cleared customs yet?','大阪來的那批貨通關了嗎？']],o:[['Our customers are happy.','我們的顧客很滿意。'],['Yes, it was released this morning.','通關了，今天早上放行的。'],['By ship, I believe.','我想是用船運。']],ans:1,k:'Has…yet? 問「是否已經」，回答 Yes，並說明時間。',w:'A 的 customers 聽起來像 customs；C 的 ship 聽起來像 shipment，都是相似音陷阱。'},
  {p:2,a:[['M','Where should I put these returned items?','這些退回來的商品要放在哪裡？']],o:[['On the shelf marked "Returns."','放在標示「Returns」的架子上。'],['They returned yesterday.','他們昨天回來了。'],['About thirty items.','大約三十件。']],ans:0,k:'Where 問地點，回答 On the shelf。',w:'B 的 returned 是「回來」；C 回答的是數量。'},
  {p:2,a:[['W','The delivery truck is running an hour behind schedule.','送貨的卡車比預定時間晚了一個小時。']],o:[['He runs every morning.','他每天早上跑步。'],['Behind the warehouse.','在倉庫後面。'],['I\'ll let the customer know.','我來通知客戶。']],ans:2,k:'直述句說出一個問題，合理的回應是「我來處理」。',w:'A 重複 run，可是意思是跑步；B 重複 behind，可是說的是位置。'},
  {p:3,kind:'conversation',a:[
    ['W','Carlos, the inventory report says we have two hundred boxes of the T-40 filters, but I can only find a hundred and fifty on the shelves.','Carlos，庫存報告說我們有兩百箱 T-40 濾網，可是我在架上只找到一百五十箱。'],
    ['M','That\'s strange. Did you check the loading dock? Sometimes new stock sits there for a day before it\'s put away.','真奇怪。你看過裝卸貨區了嗎？有時候新到的貨會在那裡放一天才上架。'],
    ['W','I did. There\'s nothing there. I\'m worried that the count in the system is wrong.','我看過了，那裡什麼都沒有。我擔心系統裡的數量是錯的。'],
    ['M','It could be. We switched to the new scanning software last week, and a few people have had trouble with it.','有可能。我們上星期換了新的掃描軟體，有幾個人用起來有問題。'],
    ['W','I see. I\'d better recount everything in that section, then.','原來如此。那我最好把那一區全部重新清點一次。'],
    ['M','Good idea. I\'ll ask Dana to give you a hand so it goes faster.','好主意。我請 Dana 幫你，這樣比較快。']],
   g:[
    {q:['What problem does the woman report?','女子提出什麼問題？'],o:[['A delivery arrived late.','貨太晚到。'],['Some items were damaged.','有些商品損壞了。'],['Some numbers do not match.','有些數字對不起來。'],['A shelf is broken.','架子壞了。']],ans:2,k:'報告說兩百箱，架上只有一百五十箱：數字對不起來。'},
    {q:['What does the man suggest may have caused the problem?','男子認為可能是什麼造成這個問題？'],o:[['A new software system','新的軟體系統'],['A supplier\'s mistake','供應商的錯誤'],['A lack of storage space','儲存空間不夠'],['A late shipment','貨太晚到']],ans:0,k:'We switched to the new scanning software last week, and a few people have had trouble with it。'},
    {q:['What does the man say he will do?','男子說他會做什麼？'],o:[['Recount the items himself','自己重新清點'],['Call the software company','打電話給軟體公司'],['Check the loading dock','檢查裝卸貨區'],['Ask a coworker to help','請一位同事幫忙']],ans:3,k:'I\'ll ask Dana to give you a hand。give a hand 是「幫忙」，Dana 換成 a coworker。'}]},
  {p:4,kind:'announcement',vis:{t:'Delivery Schedule',head:true,rows:[['Truck','Destination','Departure'],['Truck 1','Riverside','8:00 A.M.'],['Truck 2','Lakewood','9:30 A.M.'],['Truck 3','Hillcrest','11:00 A.M.'],['Truck 4','Bayview','1:00 P.M.']]},a:[
    ['M','Attention, all warehouse staff. I have an update on today\'s deliveries. Because of road construction on Highway Nine, the truck going to Lakewood will leave thirty minutes earlier than scheduled. Loading team, please make sure that truck is ready first. Also, a reminder: the safety inspection is this Thursday. All walkways must be clear of boxes and equipment before then. Finally, we\'re still looking for two volunteers to work this Saturday. If you\'re interested, see me in my office before the end of the day.','所有倉庫同仁請注意，今天的送貨有一項更新。因為九號公路道路施工，前往 Lakewood 的卡車會比預定時間提早三十分鐘出發。裝貨組，請先確認那輛卡車準備好。另外提醒：安全檢查是這個星期四，在那之前，所有走道都不能有箱子和設備。最後，我們還需要兩位自願者在這個星期六上班。有興趣的人，請在今天下班前到我的辦公室找我。']],
   g:[
    {q:['Look at the graphic. What time will the truck to Lakewood leave today?','請看圖表。前往 Lakewood 的卡車今天幾點出發？'],o:[['8:00 A.M.','早上 8:00'],['9:00 A.M.','早上 9:00'],['9:30 A.M.','早上 9:30'],['11:00 A.M.','早上 11:00']],ans:1,k:'圖表上 Lakewood 是 9:30，廣播說提早三十分鐘，所以是 9:00。圖表題的答案通常要「圖表 + 聽到的資訊」一起算。'},
    {q:['What will take place on Thursday?','星期四會有什麼事？'],o:[['A safety inspection','安全檢查'],['Road construction','道路施工'],['A staff meeting','員工會議'],['A software update','軟體更新']],ans:0,k:'the safety inspection is this Thursday。'},
    {q:['Why should listeners visit the speaker\'s office?','聽的人為什麼要去說話者的辦公室？'],o:[['To pick up a schedule','拿時間表'],['To report a problem','報告問題'],['To sign up for extra work','登記額外的上班'],['To collect safety equipment','領安全裝備']],ans:2,k:'looking for two volunteers to work this Saturday…see me in my office。自願星期六上班就是 extra work。'}]}],
 shadow:[['Has the shipment cleared customs yet?','那批貨通關了嗎？'],['The truck is running an hour behind schedule.','卡車比預定時間晚了一個小時。'],['All walkways must be clear of boxes and equipment.','所有走道都不能有箱子和設備。']],
 qa:[{q:['A delivery will be late. What would you tell the customer?','貨會晚到。你會怎麼告訴客戶？'],kw:[['i am sorry','sorry','apologize','unfortunately'],['late','delay','behind schedule','arrive','tomorrow','delivery']],s:[['I\'m sorry, but your delivery is running behind schedule. It will arrive tomorrow morning.','很抱歉，您的貨比預定時間晚，明天早上會送到。'],['We apologize for the delay. The truck will arrive about an hour late.','造成延誤，我們很抱歉。卡車大約會晚一個小時到。']]},
     {q:['Where should we store fragile items?','易碎的物品應該放在哪裡？'],kw:[['we should','you should','put','store','keep'],['shelf','shelves','box','boxes','top','carefully','separate']],s:[['We should keep them on the lower shelves and mark the boxes clearly.','應該放在比較低的架子上，並且在箱子上標示清楚。'],['Put them in a separate area and handle them carefully.','放在另外一區，並且小心搬運。']]}],
 pat:[['be + 時間 + behind schedule','We are two days behind schedule.','我們的進度落後兩天。'],['had better + 動詞原形（最好）','I\'d better check the numbers again.','我最好再檢查一次數字。'],['be clear of + 名詞（沒有…）','The exits must be clear of boxes.','出口不能堆放箱子。']]},

{id:'t6',icon:'💻',name:'技術與設備',en:'Tech & Facilities',tool:['time'],
 goal:'聽懂電腦問題、設備報修和大樓公告，抓到「原因」「解決方法」和「要聽的人做什麼」。',
 vocab:[
  ['maintenance','/ˈmeɪntənəns/','維護；保養','The elevator is closed for maintenance.'],
  ['install','/ɪnˈstɔl/','安裝','I can install the latest version.'],
  ['update','/ˈʌpˌdeɪt/','更新','It started after the system update.'],
  ['back up','/bæk ˈʌp/','備份','Have you backed up your files?'],
  ['technician','/tɛkˈnɪʃən/','技術人員','A technician will come at two.'],
  ['out of order','/aʊt əv ˈɔrdɚ/','故障','The copy machine is out of order.'],
  ['password','/ˈpæsˌwɝd/','密碼','How do I reset my password?'],
  ['facility','/fəˈsɪləti/','設施','The facilities office is on the first floor.']],
 related:[['freeze','當機'],['restart','重新開機'],['remotely','遠端地'],['outdated','過時的'],['shut down','關閉；停止運作'],['parking garage','停車場'],['inconvenience','不便'],['technical support','技術支援']],
 vary:[
  {t:'描述問題',items:[['My computer keeps freezing.','我的電腦一直當機。'],['The projector isn\'t working.','投影機不能用。'],['The air conditioner is out of order.','冷氣故障了。']],n:'keep + V-ing 是「一直…」。isn\'t working、is broken、is out of order 都是「壞了」。'},
  {t:'解決方法',items:[['I can install the latest version remotely.','我可以遠端安裝最新版本。'],['Just save your work and leave the computer on.','把工作存檔，電腦開著就好。'],['There\'s a guide on the company website.','公司網站上有說明。']],n:'leave + 東西 + on 是「讓它開著」；turn off 是關掉。'},
  {t:'施工公告',items:[['The elevators will be shut down for maintenance.','電梯將停止運作，進行保養。'],['Use the Oak Street entrance instead.','請改用 Oak 街的入口。'],['We apologize for the inconvenience.','造成不便，敬請見諒。']],n:'instead 是「改成」。公告常考：什麼地方關閉、到什麼時候、改用什麼。'}],
 qs:[
  {p:1,pic:'@i-device-laptop',o:[['A technician is repairing a monitor.','技術人員正在修理螢幕。'],['A keyboard is being packed into a box.','有人正在把鍵盤裝進箱子。'],['A laptop has been left open.','一台筆電開著放在那裡。'],['Some cables are lying on the floor.','地上有一些電線。']],ans:2,k:'照片裡只有一台打開的筆電。has been left open 是「被打開放著」的狀態。',w:'照片裡沒有人，所以 A、B 不對；也沒有電線。'},
  {p:2,a:[['M','Who should I call about the air conditioner?','冷氣的問題我應該打給誰？']],o:[['It\'s too cold in here.','這裡太冷了。'],['Around three o\'clock.','大約三點。'],['The maintenance department.','維修部門。']],ans:2,k:'Who 不一定回答人名，也可以回答部門。',w:'A 只是和冷氣有關；B 回答的是時間。'},
  {p:2,a:[['W','Have you backed up the files on your computer?','你電腦裡的檔案備份了嗎？']],o:[['I\'ll be back at two.','我兩點回來。'],['Not yet. I\'ll do it right now.','還沒，我現在就做。'],['They\'re filed by date.','它們是按日期歸檔的。']],ans:1,k:'Have you…? 問是否已經做了，回答 Not yet（還沒）。',w:'A 的 back 是「回來」；C 的 filed 是「歸檔」。都是重複聲音，意思不同。'},
  {p:2,a:[['M','Do you know how to reset the password?','你知道怎麼重設密碼嗎？']],o:[['There\'s a guide on the company website.','公司網站上有說明。'],['Yes, I passed the test.','是的，我通過考試了。'],['The word was misspelled.','那個字拼錯了。']],ans:0,k:'間接回答：沒有說 Yes 或 No，而是告訴你去哪裡找方法。這種回答在中級很常見。',w:'B 的 passed 和 C 的 word 都是從 password 拆出來的相似音陷阱。'},
  {p:3,kind:'conversation',a:[
    ['M','Hi, this is Aaron in accounting. My computer keeps freezing whenever I open the payroll program.','你好，我是會計部的 Aaron。我每次打開薪資程式，電腦就當機。'],
    ['W','Hi, Aaron. When did this start?','嗨，Aaron。這是什麼時候開始的？'],
    ['M','Yesterday afternoon, right after the system update. I\'ve restarted it three times already.','昨天下午，就在系統更新之後。我已經重新開機三次了。'],
    ['W','OK. We\'ve had a few reports like that. The update doesn\'t work well with older versions of the payroll program. I can install the latest version for you remotely. It\'ll take about twenty minutes.','好。我們收到幾個類似的回報。這次更新和舊版的薪資程式不太相容。我可以遠端幫你安裝最新版本，大約要二十分鐘。'],
    ['M','That\'s fine, but I have to send out the salary data by noon.','可以，不過我中午以前必須把薪資資料送出去。'],
    ['W','No problem. I\'ll start right away. Just save your work and leave the computer on.','沒問題，我馬上開始。你只要把工作存檔，電腦開著就好。']],
   g:[
    {q:['What department does the woman most likely work in?','女子最可能在哪個部門工作？'],o:[['Accounting','會計'],['Technical support','技術支援'],['Human resources','人力資源'],['Sales','業務']],ans:1,k:'女子處理電腦問題、幫忙安裝程式，是技術支援。會計部是男子的部門。'},
    {q:['According to the woman, what is causing the problem?','根據女子的說法，問題的原因是什麼？'],o:[['A broken keyboard','鍵盤壞了'],['A computer virus','電腦病毒'],['A weak Internet connection','網路訊號不好'],['An outdated program','程式版本太舊']],ans:3,k:'The update doesn\'t work well with older versions。older versions 換句話說是 an outdated program。'},
    {q:['What is the man told to do?','男子被告知要做什麼？'],o:[['Keep his computer turned on','讓電腦開著'],['Restart his computer','重新開機'],['Come back after noon','中午以後再來'],['Bring his computer to her office','把電腦拿到她的辦公室']],ans:0,k:'leave the computer on 換句話說是 keep his computer turned on。'}]},
  {p:4,kind:'announcement',a:[
    ['W','Good morning. This is a message from the facilities office for everyone in the Carter Building. This weekend, the elevators on the east side will be shut down for regular maintenance. The work will begin Saturday at 8 A.M. and should be finished by Sunday evening. During this time, please use the elevators on the west side or the stairs. In addition, the parking garage will remain open, but the entrance on Pine Street will be closed. Use the Oak Street entrance instead. We apologize for the inconvenience.','早安。這是設施管理處給 Carter 大樓所有人的訊息。這個週末，東側的電梯將停止運作，進行定期保養。工程從星期六早上八點開始，預計星期天晚上以前完成。這段期間，請使用西側的電梯或樓梯。另外，停車場照常開放，但是 Pine 街的入口將會關閉，請改用 Oak 街的入口。造成不便，敬請見諒。']],
   g:[

{id:'t7',icon:'💰',name:'財務與預算',en:'Finance & Budgets',tool:['price','num'],

 vary:[
  {t:'大數字',items:[['About twelve thousand dollars.','大約一萬兩千元。'],['We could save about ten thousand dollars.','我們大約可以省下一萬元。'],['Any expense over five hundred dollars.','任何超過五百元的費用。']],n:'英文沒有「萬」：10,000 是 ten thousand，120,000 是 a hundred and twenty thousand。'},

 qs:[
  {p:1,pic:'@i-building-bank',o:[['People are entering a building.','人們正走進一棟建築物。'],['A roof is being repaired.','有人正在修理屋頂。'],['Flags are flying in front of a building.','建築物前面有旗子在飄。'],['Columns line the front of the building.','建築物的正面有一排柱子。']],ans:3,k:'建築物正面有一排柱子（columns）。line 當動詞是「沿著…排成一排」，是 Part 1 的常考字。',w:'照片裡沒有人，所以 A、B 不對；也沒有旗子。'},
  {p:2,a:[['W','How much did we spend on travel last quarter?','我們上一季的差旅花了多少錢？']],o:[['About twelve thousand dollars.','大約一萬兩千元。'],['To Singapore and Seoul.','去新加坡和首爾。'],['A quarter past nine.','九點十五分。']],ans:0,k:'How much 問金額，回答 About twelve thousand dollars。',w:'B 回答的是去哪裡；C 的 quarter 是「十五分鐘」，和「季度」意思不同。'},
  {p:2,a:[['M','Could you approve this expense report today?','你今天可以核准這份費用報告嗎？']],o:[['It was expensive.','那很貴。'],['Sure, just leave it on my desk.','好，放在我桌上就可以了。'],['The reporter is here.','記者來了。']],ans:1,k:'Could you…? 是請求，回答 Sure，並告訴對方怎麼做。',w:'A 的 expensive 聽起來像 expense；C 的 reporter 聽起來像 report，都是相似音陷阱。'},
  {p:2,a:[['W','Isn\'t the budget meeting scheduled for tomorrow?','預算會議不是排在明天嗎？']],o:[['Yes, it\'s a tight budget.','是的，預算很緊。'],['In the main conference room.','在大會議室。'],['No, it\'s been pushed back to Thursday.','不是，已經延到星期四了。']],ans:2,k:'否定問句照事實回答：不是明天，所以說 No，再說出新的時間。',w:'A 只是重複 budget，沒有回答時間；B 回答的是地點。'},
  {p:3,kind:'conversation',a:[
    ['W','Mr. Grant, I\'ve finished looking over the budget proposal for next year.','Grant 先生，我看完明年的預算提案了。'],
    ['M','Thanks, Emily. Is there anything we should change?','謝謝你，Emily。有什麼應該修改的地方嗎？'],
    ['W','Well, the advertising budget is up by thirty percent, but the training budget has been cut in half. I\'m concerned about that. We\'re hiring six new people in the spring.','嗯，廣告預算增加了百分之三十，可是訓練預算被砍了一半。我很擔心這一點，因為我們春天要請六位新人。'],
    ['M','Good point. They\'ll all need training. Do you think we could move some money from advertising?','說得對，他們都需要訓練。你覺得可以從廣告那邊挪一些錢過來嗎？'],
    ['W','I think so. If we advertise less in print and more online, we could save about ten thousand dollars.','我想可以。如果少做一點平面廣告，多做網路廣告，我們大約可以省下一萬元。'],
    ['M','That sounds reasonable. Could you revise the numbers and send them to me by Wednesday?','聽起來很合理。你可以修改數字，星期三以前寄給我嗎？']],

    {q:['What is the woman concerned about?','女子擔心什麼？'],o:[['Advertising costs too much.','廣告太花錢。'],['The deadline is too soon.','期限太趕。'],['There may not be enough money for training.','訓練的錢可能不夠。'],['Too many people are being hired.','請了太多人。']],ans:2,k:'the training budget has been cut in half. I\'m concerned about that。因為要請六位新人，訓練經費卻減半。'},
    {q:['What does the man ask the woman to do?','男子請女子做什麼？'],o:[['Update some figures','更新一些數字'],['Contact an advertising agency','聯絡廣告公司'],['Schedule a training session','安排訓練課程'],['Interview job candidates','面試應徵者']],ans:0,k:'Could you revise the numbers? 換句話說是 update some figures。'}]},
  {p:4,kind:'talk',a:[
    ['M','Thanks for joining this short training session on our new expense system. Starting next month, paper receipts will no longer be accepted. Instead, you\'ll take a photo of each receipt with your phone and upload it using the company app. Once your manager approves the report, you\'ll be paid back within five business days, much faster than the three weeks it takes now. Keep in mind that any expense over five hundred dollars still needs approval in advance. I\'ll now show you how to use the app, so please take out your phones.','謝謝各位參加這場關於新費用系統的簡短訓練。從下個月開始，不再接受紙本收據。各位要改用手機拍下每一張收據，再用公司的應用程式上傳。主管核准報告之後，各位會在五個工作天內拿到退款，比現在的三個星期快很多。請記得，任何超過五百元的費用，還是需要事先核准。我現在示範怎麼使用這個應用程式，請各位把手機拿出來。']],
   g:[
    {q:['What is the talk mainly about?','這段談話主要是關於什麼？'],o:[['A new way to report expenses','申報費用的新方法'],['A change in salaries','薪資的調整'],['A company phone plan','公司的手機方案'],['A new travel agency','新的旅行社']],ans:0,k:'training session on our new expense system：新的費用系統。'},
    {q:['What is an advantage of the new system?','新系統有什麼優點？'],o:[['Higher spending limits','花費上限提高'],['Fewer approvals','需要的核准變少'],['Faster repayment','退款比較快'],['Free phones','免費手機']],ans:2,k:'paid back within five business days, much faster than the three weeks it takes now。paid back 換成 repayment。'},
    {q:['What will the listeners most likely do next?','聽的人接下來最可能做什麼？'],o:[['Fill out a paper form','填紙本表格'],['Watch a demonstration','看示範'],['Talk to their managers','找主管談'],['Submit their receipts','交出收據']],ans:1,k:'I\'ll now show you how to use the app。show you how 換句話說是 a demonstration（示範）。'}]}],
 shadow:[['The training budget has been cut in half.','訓練預算被砍了一半。'],['We could save about ten thousand dollars.','我們大約可以省下一萬元。'],['You\'ll be paid back within five business days.','你會在五個工作天內拿到退款。']],
 qa:[{q:['How can a company save money?','一家公司可以怎麼省錢？'],kw:[['it can','they can','we can','by','i think'],['less','save','online','paper','cut','reduce','travel','energy']],s:[['It can save money by using less paper and holding meetings online.','可以少用紙，並且在線上開會來省錢。'],['I think they can reduce travel costs and advertise online.','我認為他們可以降低差旅費，並且改在網路上打廣告。']]},
     {q:['What do you spend the most money on each month?','你每個月花最多錢在什麼地方？'],kw:[['i spend','most of','the most'],['food','rent','on','transportation','clothes','phone']],s:[['I spend the most money on food and rent.','我花最多錢在吃和房租上。'],['Most of my money goes to rent and transportation.','我大部分的錢花在房租和交通上。']]}],
 pat:[['be up / down by + 百分比','The advertising budget is up by thirty percent.','廣告預算增加了百分之三十。'],['no longer + 動詞（不再）','Paper receipts will no longer be accepted.','不再接受紙本收據。'],['Once + 句子, 句子（一旦…就）','Once your manager approves it, you\'ll be paid.','主管一核准，你就會拿到錢。']]},

  {p:2,a:[['W','Would you prefer an aisle seat or a window seat?','你想要走道還是靠窗的座位？']],o:[['Yes, I\'d prefer that.','是的，我比較想要那個。'],['Either is fine with me.','哪一個都可以。'],['I\'ll see you there.','到時候見。']],ans:1,k:'選擇問句也可以回答「都可以」：Either is fine with me。',w:'A 用 Yes 回答選擇問句，不對；C 的 see 聽起來像 seat，是相似音陷阱。'},

  {p:3,kind:'conversation',a:[

/* ---------- 語音合成：美、英、澳、加口音，男聲女聲 ---------- */
let voices=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|organ|princess|ralph|superstar|trinoids|whisper|wobble|zarvox|fred|kathy|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
const MALE=/\bmale\b|david|mark|guy|daniel|alex|aaron|arthur|oliver|george|james|ryan|william|thomas|gordon|\blee\b|\btom\b|rishi|christopher|eric|roger|steffan|andrew|brian|liam|connor|duncan|davis|jason|tony|brandon|jacob|mitchell|darren|ken\b|neil|clayton|sean/i;
const isMale=v=>!/female/i.test(v.name)&&MALE.test(v.name);
function loadVoices(){try{const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name));
  const main=all.filter(v=>/^en[-_](US|GB|AU|CA|NZ|IE)/i.test(v.lang));voices=main.length?main:all}catch(e){voices=[]}}
function primaryVoice(){return voices.find(v=>/google us english/i.test(v.name))||voices.find(v=>/en[-_]US/i.test(v.lang)&&!isMale(v))||voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0]||null}
function pool(){if(settings.accent==='us'){const us=voices.filter(v=>/en[-_]US/i.test(v.lang));if(us.length)return us}return voices}
function voiceFor(g,seed){
  if(g==='N'||!voices.length)return{voice:primaryVoice(),pitch:1};
  const male=g[0]==='M',n=g.endsWith('2')?1:0,same=pool().filter(v=>isMale(v)===male);
  if(same.length)return{voice:same[(seed+n)%same.length],pitch:n&&same.length<2?(male?0.8:1.25):1};
  return{voice:primaryVoice(),pitch:male?(n?0.55:0.7):(n?1.3:1)};
}
const accentCount=()=>new Set(voices.map(v=>v.lang.replace('_','-').toLowerCase())).size;
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(state.view==='home')renderHome()}}
let tok=0,warmed=false;
function speak(lines,onend,rate){
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不能播放語音。');return}
  speechSynthesis.cancel();const my=++tok;let i=0;
  const seed=hashKey(lines.map(l=>l[1]).join('|'));
  const next=()=>{
    if(my!==tok)return;
    if(i>=lines.length){onend&&onend();return}
    const [g,t]=lines[i++];
    if(g==='PAUSE'){setTimeout(next,t);return}
    const v=voiceFor(g,seed);
    const u=new SpeechSynthesisUtterance(String(t).trim());
    u.lang=v.voice?v.voice.lang:'en-US';if(v.voice)u.voice=v.voice;u.pitch=v.pitch;u.rate=rate||settings.rate;
    u.onend=()=>setTimeout(next,g==='N'?400:300);u.onerror=()=>setTimeout(next,100);
    speechSynthesis.speak(u);
  };
  /* 第一次播放先送出一段無聲的語音，讓喇叭先準備好，第一個字才不會被吃掉 */
  if(!warmed){warmed=true;const w=new SpeechSynthesisUtterance('a');w.volume=0;const pv=primaryVoice();if(pv){w.voice=pv;w.lang=pv.lang}else w.lang='en-US';w.onend=()=>setTimeout(next,60);w.onerror=()=>setTimeout(next,60);setTimeout(()=>speechSynthesis.speak(w),200)}
  else setTimeout(next,250);

const REC_FAIL='沒辦法啟動錄音。請確認已允許麥克風，並用 Chrome（電腦、Android）或 Safari（iPhone）開啟。';

  h.stop=()=>{try{r.stop()}catch(_){}setTimeout(finish,1500)};

    h.interim&&h.interim(finalAlts?finalAlts[0]:last);

const CONTR={"i'm":"i am","it's":"it is","he's":"he is","she's":"she is","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","we're":"we are","they're":"they are","you're":"you are","i'll":"i will","we'll":"we will","you'll":"you will","it'll":"it will","i'd":"i would","we'd":"we would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","haven't":"have not","hasn't":"has not","i've":"i have","we've":"we have","you've":"you have","let's":"let us","couldn't":"could not","wouldn't":"would not","shouldn't":"should not","ok":"okay"};
/* 把一個字（或辨識結果）變成可以比對的小寫單字 */
function toks(s){
  s=String(s).toLowerCase().replace(/[’‘`]/g,"'")
    .replace(/(\d{1,2}):(\d\d)/g,(m,a,b)=>numEn(a)+' '+(+b===0?"o'clock":(+b<10?'oh ':'')+numEn(b)))
    .replace(/\$\s?(\d+)\.(\d\d)/g,(m,a,b)=>numEn(a)+' dollars '+numEn(b)+' cents').replace(/\$\s?([\d,]+)/g,(m,a)=>numEn(a.replace(/,/g,''))+' dollars')
    .replace(/(\d+)%/g,(m,a)=>numEn(a)+' percent').replace(/(\d+)(st|nd|rd|th)\b/g,(m,a)=>ordEn(a)).replace(/\d[\d,]*/g,m=>numEn(m.replace(/,/g,'')));
  const out=[];(s.match(/[a-z]+(?:'[a-z]+)?/g)||[]).forEach(w=>{(CONTR[w]||w).split(' ').forEach(x=>out.push(x.replace(/'s$/,'')))});return out;
}
function compare(target,heard){
  const ws=target.split(/\s+/).filter(Boolean),A=[],own=[];
  ws.forEach((w,i)=>toks(w).forEach(x=>{A.push(x);own.push(i)}));
  const B=toks(heard),n=A.length,m=B.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const bad=new Set();hit.forEach((h,k)=>{if(!h)bad.add(own[k])});
  return{score:n?Math.round(hit.filter(Boolean).length/n*100):0,html:ws.map((w,k)=>`<span class="${bad.has(k)?'miss':'ok'}">${esc(w)}</span>`).join(' ')};
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'],DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function genItem(kind){
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)];
  if(kind==='date'){const y=2026,m=r(1,12),d=r(1,new Date(y,m,0).getDate()),w=new Date(y,m-1,d).getDay(),M=MONTHS[m-1];

   <div class="opts ${sent?'':'pics'}" ${sent?'':'style="grid-template-columns:1fr 1fr"'}>${[0,1].map(k=>{const o=pairWord(it,k);let cls='opt';if(done){if(k===it.play)cls+=' right';else if(k===dc.ans[dc.i])cls+=' wrong'}

/* ---------- 模擬測驗 ---------- */
function mockRefs(set){
  const ts=set==='A'?T.slice(0,HALF):set==='B'?T.slice(HALF):T;
  let refs=[];PLIST.forEach(p=>ts.forEach(t=>t.qs.forEach((q,k)=>{if(q.p===p)refs.push([t.id,k])})));
  if(set==='R'){
    const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    const singles=p=>refs.filter(r=>getQ(...r).p===p);
    const groups=p=>{const m={};refs.forEach(r=>{const q=getQ(...r);if(q.p===p)(m[q.grp]=m[q.grp]||[]).push(r)});return Object.values(m)};
    refs=[...sh(singles(1)).slice(0,HALF),...sh(singles(2)).slice(0,HALF*3),...sh(groups(3)).slice(0,HALF).flat(),...sh(groups(4)).slice(0,HALF).flat()];
  }
  return refs;
}
function buildMock(set,refs,ans,plays,i,gp){
  mock={set,refs,qs:refs.map(([s,k])=>Object.assign({},getQ(s,k),{src:s,qidx:k,topic:s})),i:i||0,
    ans:ans||new Array(refs.length).fill(null),plays:plays||refs.map(()=>1),gp:gp||{},done:false};
}
/* 暫存：每次作答、換題、播放後都存一次，下次可以接著做 */
function saveMock(){if(mock&&!mock.done)store.set('mocksave',{set:mock.set,refs:mock.refs,ans:mock.ans,plays:mock.plays,i:mock.i,gp:mock.gp,time:Date.now()})}
function clearMock(){store.set('mocksave',null)}
function startMock(set){buildMock(set||'A',mockRefs(set||'A'));saveMock();state.view='mock';reviewAll=false;render()}
function resumeMock(){const sv=store.get('mocksave',null);if(!sv)return;try{buildMock(sv.set,sv.refs,sv.ans,sv.plays,sv.i,sv.gp)}catch(e){clearMock();renderHome();return}state.view='mock';reviewAll=false;render()}
function renderMock(){
  if(mock.done)return renderMockResult();
  trSeq=0;const q=mock.qs[mock.i];const answered=mock.ans.filter(x=>x!=null).length;
  app.innerHTML=`<div class="topbar"><button class="back" data-act="quitMock">${bt('暫存並離開')}</button><h2>綜合模擬測驗<span class="uit">${SET_NAME[mock.set]}</span></h2></div>
  <p class="small warnline">⏱ 正式考試中間不會暫停</p>
  <p class="small muted" style="margin:4px 0 0">${answered} / ${mock.qs.length}　點號碼可以回去改答案。</p>
  ${navStrip(mock.qs.length,mock.i,i=>mock.ans[i]!=null?'done':'')}
  ${questionHTML(q,{num:mock.i+1,total:mock.qs.length,chosen:mock.ans[mock.i],reveal:false,playsLeft:mock.plays[mock.i],idx:mock.i})}
  <div class="row" style="margin-top:12px">${mock.i>0?`<button class="btn ghost" data-act="mockPrev">${bt('上一題')}</button>`:''}
    ${mock.i<mock.qs.length-1?`<button class="btn" data-act="mockNext">${bt('下一題')}</button>`:''}
    <button class="btn red" data-act="mockEnd">${bt('交卷，看成績')}</button></div>`;
}
function renderMockResult(){
  trSeq=0;const qs=mock.qs,ok=qs.map((q,i)=>mock.ans[i]===q.ans),total=ok.filter(Boolean).length;
  const byPart=PLIST.map(p=>{const ix=qs.map((q,i)=>i).filter(i=>qs[i].p===p);return{p,c:ix.filter(i=>ok[i]).length,n:ix.length}}).filter(x=>x.n);
  const byTopic=T.map(t=>{const ix=qs.map((q,i)=>i).filter(i=>qs[i].topic===t.id);return{t,c:ix.filter(i=>ok[i]).length,n:ix.length}}).filter(x=>x.n);
  const weak=byTopic.slice().sort((a,b)=>a.c/a.n-b.c/b.n)[0];
  const wp=byPart.slice().sort((a,b)=>a.c/a.n-b.c/b.n)[0];
  const partAdvice=wp.c<wp.n?`<div class="note"><b>最需要加強：${PART_NO[wp.p]} ${PARTS[wp.p].n}　</b>${esc(TIPS[wp.p])}</div>`:'';
  const row=(name,x)=>`<tr><td>${name}</td><td>${x.c}/${x.n}</td><td><div class="bar"><span style="width:${x.c/x.n*100}%"></span></div></td></tr>`;
  const items=qs.map((q,i)=>(!reviewAll&&ok[i])?'':`<div class="card"><div class="row" style="justify-content:space-between"><span class="small muted">${i+1}｜${PART_NO[q.p]} ${PARTS[q.p].n}</span><span class="verdict ${ok[i]?'ok':'no'}" style="font-size:15px">${ok[i]?'答對了！':'答錯了'}</span></div>
    ${q.pic?`<div class="pic" style="min-height:0">${picHTML(q.pic)}</div>`:''}
    <div class="small">你的答案 ${mock.ans[i]==null?'—':L[mock.ans[i]]}　正確答案 ${L[q.ans]}</div>
    ${reviewBlock(q,i,{noteBtn:noteBtnFor(q.src,q.qidx)})}</div>`).join('');
  app.innerHTML=`${topbar('模擬測驗成績')}
  <p style="margin-top:20px"><span class="result-big">${total}</span><span class="muted"> / ${qs.length}　答對率 ${Math.round(total/qs.length*100)}%</span></p>
  <p class="muted small">這是練習用的答對題數，不是正式考試的量尺分數。</p>
  <h3>各部分</h3><table><tbody>${byPart.map(x=>row(`${PART_NO[x.p]} ${PARTS[x.p].n}`,x)).join('')}</tbody></table>
  ${partAdvice}
  <h3>各主題</h3><table><tbody>${byTopic.map(x=>row(`${x.t.icon} ${esc(x.t.name)}`,x)).join('')}</tbody></table>
  ${weak.c<weak.n?`<p style="margin-top:16px">建議先複習：<b>${esc(weak.t.name)}</b></p><button class="btn" data-act="topic" data-t="${weak.t.id}">${bt('去複習這個主題')}</button>`:`<p style="margin-top:16px">全部答對！可以去做官方的範例試題了。</p>`}
  <h3>檢討</h3>
  <div class="row"><button class="btn sm ${reviewAll?'ghost':''}" data-act="reviewMode" data-m="wrong">${bt('只看錯題')}</button><button class="btn sm ${reviewAll?'':'ghost'}" data-act="reviewMode" data-m="all">${bt('看全部題目')}</button></div>
  ${items||`<p class="muted">沒有錯題。</p>`}
  <div class="row" style="margin-top:20px"><button class="btn" data-act="wrongStart">${bt('練習所有錯題')}</button><button class="btn ghost" data-act="mockStart">${bt('再做一次')}</button></div>${footer()}`;
}

/* ---------- 事件 ---------- */
const VIEWS={home:renderHome,topic:renderTopic,mock:renderMock,decode:renderDecode,wrong:renderWrong,book:renderBook};
function render(){stopSpeak();VIEWS[state.view]()}
function rerenderKeep(){const y=window.scrollY;VIEWS[state.view]();window.scrollTo(0,y)}
function curQ(i){return state.view==='mock'?mock.qs[i]:state.view==='wrong'?wqQ(i):topicObj().qs[i]}
/* 模擬測驗：題組的本文只播放一次，之後同一題組只念問題 */
function officialLines(q){
  if(!q.grp)return audioFor(q);
  const heard=mock.gp[q.grp];mock.gp[q.grp]=true;return audioFor(q,heard);
}
function addQNote(tid,k){if(notes.some(n=>n.type==='q'&&n.t===tid&&n.k===k))return;notes.push({id:Date.now()+'',type:'q',t:tid,k,text:'',time:Date.now()});saveNotes()}
const freshLp=qi=>({qi:qi||0,ans:{},show:{},qtr:{}});

app.addEventListener('change',e=>{

app.addEventListener('click',e=>{

  switch(a){
    case'home':state.view='home';render();window.scrollTo(0,0);break;
    case'jumpTo':{const el=document.getElementById(b.dataset.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break}

    case'saySlow':speak([['W',b.dataset.text]],null,0.6);break;
    case'sayAll':speak(t.vocab.map(v=>['W',v[0]]));break;
    case'tr':doTr(b.dataset.id);break;
    case'trHide':hideTr(b.dataset.id);break;
    case'star':{const w=b.dataset.w;if(inBook(w))book=book.filter(x=>x.w!==w);else book.push({w,p:b.dataset.p,z:b.dataset.z,t:b.dataset.t});saveBook();
      document.querySelectorAll(`.star[data-w="${CSS.escape(w)}"]`).forEach(s=>{const on=inBook(w);s.classList.toggle('on',on);s.textContent=on?'★':'☆'});break}
    case'unstar':book=book.filter(x=>x.w!==b.dataset.w);saveBook();rerenderKeep();break;

    case'noteDel':notes=notes.filter(n=>n.id!==b.dataset.id);saveNotes();rerenderKeep();break;
    case'noteQ':addQNote(b.dataset.t,+b.dataset.k);b.disabled=true;b.innerHTML=bt('已加入筆記');break;
    case'replayQ':speak(audioFor(getQ(b.dataset.t,+b.dataset.k)));break;
    case'toolMode':{const s=toolState[b.dataset.k];s.mode=b.dataset.m;s.open=false;rerenderKeep();break}
    case'toolSay':say1(toolState[b.dataset.k].item.say);break;

    case'play':
      if(state.view==='mock'){if(mock.plays[mock.i]<=0)return;mock.plays[mock.i]--;const lines=officialLines(mock.qs[mock.i]);saveMock();b.disabled=true;const h=app.querySelector('.player .hint');if(h)h.textContent='正在播放……';playLines(lines,()=>{const h2=app.querySelector('.player .hint');if(h2)h2.textContent='播放完了，請作答。'})}
      else playLines(audioFor(curQ(state.view==='wrong'?wq.qi:lp.qi)));
      break;
    case'showText':lp.show[lp.qi]=!lp.show[lp.qi];rerenderKeep();break;
    case'qtr':lp.qtr[lp.qi]=!lp.qtr[lp.qi];rerenderKeep();break;
    case'choose':
      if(state.view==='mock'){mock.ans[mock.i]=i;saveMock();rerenderKeep()}
      else if(state.view==='wrong'){if(wq.ans[wq.qi]!=null)return;wq.ans[wq.qi]=i;stopSpeak();const[tid,k]=wq.list[wq.qi];prog(tid).q[k]=(i===wqQ(wq.qi).ans);saveProg();rerenderKeep()}
      else{if(lp.ans[lp.qi]!=null)return;lp.ans[lp.qi]=i;stopSpeak();prog(t.id).q[lp.qi]=(i===t.qs[lp.qi].ans);saveProg();rerenderKeep()}
      break;

    case'mockPrev':mock.i--;saveMock();render();window.scrollTo(0,0);break;
    case'mockEnd':{const left=mock.ans.filter(x=>x==null).length;if(left&&!confirm(`還有 ${left} 題沒有作答。確定要交卷嗎？`))return;mock.done=true;mock.qs.forEach((q,j)=>{if(mock.ans[j]!=null)prog(q.src).q[q.qidx]=(mock.ans[j]===q.ans)});saveProg();clearMock();render();window.scrollTo(0,0);break}
    case'reviewMode':reviewAll=b.dataset.m==='all';rerenderKeep();break;
    case'quitMock':saveMock();state.view='home';render();window.scrollTo(0,0);setTimeout(()=>{const el=document.getElementById('sec-mock');if(el)el.scrollIntoView()},50);break;
    case'mockResume':resumeMock();window.scrollTo(0,0);break;
    case'mockDiscard':if(confirm('確定要放棄這份還沒做完的模擬測驗嗎？')){clearMock();renderHome();const el=document.getElementById('sec-mock');if(el)el.scrollIntoView()}break;
  }
});
async function micTest(){
  const out=$('#micRes');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){out.textContent='這個瀏覽器不能使用麥克風。';return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());out.innerHTML=`<span style="color:var(--green)">麥克風可以使用了！</span>`}
  catch(e){out.innerHTML=`<span style="color:var(--red)">麥克風沒有開啟。請照上面的步驟允許麥克風。</span>`}
}
/* 打開 Google 翻譯：中文翻成英文 */
function openGoogleTr(text){
  const out=$('#myOut');
  if(!text){out.innerHTML=`<div class="warn">請先在框裡寫一個句子。</div>`;return}
  try{if(navigator.clipboard)navigator.clipboard.writeText(text).catch(()=>{})}catch(e){}
  window.open(`https://translate.google.com/?sl=zh-TW&tl=en&text=${encodeURIComponent(text)}&op=translate`,'_blank','noopener');
  const steps=['如果 Google 翻譯裡沒有你的句子，請在輸入框貼上（句子已經幫你複製好了）。','複製翻譯出來的英文。','回到這裡，把英文貼到上面的框，再按「聽這句」或「錄音跟讀這句」。'];
  out.innerHTML=`<div class="trout"><b>已打開 Google 翻譯。</b><ol style="margin:6px 0 0;padding-left:22px">${steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="small muted">翻譯結果僅供參考，可以請老師確認。</div></div>`;
}
function doRec(kind,i){
  const t=topicObj(),id=kind==='my'?'my':kind+i,btn=$('#rec-'+id),res=$('#res-'+id);if(!btn)return;
  let target='';
  if(kind==='my'){target=($('#myInput').value||'').trim();
    if(!/[a-z]/i.test(target)||/[\u3400-\u9fff]/.test(target)){res.innerHTML=`<div class="warn">請先寫英文句子，或按「翻譯成英文」。</div>`;return}
    $('#myOut').innerHTML=`<div class="trout" style="margin-top:8px"><div class="sent" id="sent-my" lang="en">${esc(target)}</div></div>`}
  if(recH){recH.stop();return}
  const label=btn.innerHTML;stopSpeak();btn.classList.add('on');btn.innerHTML=bt('說完了，按這裡停止');
  res.innerHTML=`<div class="muted">🎙️ 正在聽，請開始說…</div>`;
  const done=()=>{btn.classList.remove('on');btn.innerHTML=label};
  recognize({interim:txt=>{res.innerHTML=`<div class="muted">🎙️ 聽到了： <b lang="en">${esc(txt)}</b></div>`},res:alts=>{
    done();
    if(kind==='s'||kind==='my'){
      if(kind==='s')target=t.shadow[i][0];
      let best={score:-1};alts.forEach(h=>{const r=compare(target,h);if(r.score>best.score)best=Object.assign(r,{heard:h})});
      const el=$(kind==='s'?'#sent-s'+i:'#sent-my');if(el)el.innerHTML=best.html;
      if(kind==='s'){const p=prog(t.id);p.s['s'+i]=Math.max(p.s['s'+i]||0,best.score);saveProg()}
      const msg=best.score>=85?'很好！':best.score>=60?'不錯，注意紅色的字再試一次。':'再聽一次，慢慢說。';
      res.innerHTML=`<span class="score">${best.score}</span>　${msg}<div class="muted">辨識到：<span lang="en">${esc(best.heard)}</span></div>`;
    }else{
      const x=t.qa[i];let bestH=alts[0],bestN=-1,bestG=[];
      alts.forEach(h=>{const hl=' '+toks(h).join(' ')+' ';const g=x.kw.map(grp=>grp.some(w=>hl.includes(' '+toks(w).join(' ')+' ')||h.toLowerCase().includes(w)));const n=g.filter(Boolean).length;if(n>bestN){bestN=n;bestH=h;bestG=g}});
      const all=bestN===x.kw.length;
      res.innerHTML=`<div class="verdict ${all?'ok':'no'}" style="font-size:16px">${all?'完成！句子裡有需要的關鍵字。':'還差一點，試著加上沒有出現的關鍵字。'}</div>
        <div lang="en">${x.kw.map((grp,k)=>`<span class="kw ${bestG[k]?'ok':''}">${esc(grp.join(' / '))}</span>`).join('')}</div>
        <div class="muted">辨識到：<span lang="en">${esc(bestH)}</span></div>`;
    }
  },err:msg=>{done();res.innerHTML=`<div class="warn">${esc(msg)}</div>`}});
}
